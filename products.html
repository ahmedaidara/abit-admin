<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B3D2E" />
  <title>ABIT Admin — Produits</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/design-system.css" />
  <style>
    .admin-layout { display: flex; min-height: 100dvh; }
    .sidebar {
      width: 240px; background: var(--abit-green-dark); color: white;
      padding: var(--space-6) var(--space-4); flex-shrink: 0; display: none;
    }
    @media (min-width: 900px) {
      .sidebar { display: block; }
      .mobile-nav { display: none !important; }
    }
    .sidebar .logo { font-size: 1.25rem; font-weight: 700; margin-bottom: var(--space-8); }
    .sidebar a {
      display: block; padding: var(--space-3); border-radius: var(--radius-sm);
      margin-bottom: 2px; font-size: 0.9rem; color: rgba(255,255,255,0.75);
    }
    .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.1); color: white; }
    .main-admin { flex: 1; padding: var(--space-4); padding-bottom: 80px; max-width: 100%; overflow-x: hidden; }
    .mobile-nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: white;
      border-top: 1px solid var(--abit-gray-100); display: flex; z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .mobile-nav a {
      flex: 1; min-width: 70px; text-align: center; padding: 10px 4px;
      font-size: 0.65rem; color: var(--abit-gray-400);
    }
    .mobile-nav a.active { color: var(--abit-green); }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: var(--space-3);
      justify-content: space-between; align-items: center; margin-bottom: var(--space-5);
    }
    .product-row {
      display: flex; gap: var(--space-3); align-items: center;
      padding: var(--space-3); border-bottom: 1px solid var(--abit-gray-100);
    }
    .product-row:last-child { border-bottom: none; }
    .thumb {
      width: 56px; height: 56px; border-radius: var(--radius-sm);
      object-fit: cover; background: var(--abit-gray-50); flex-shrink: 0;
    }
    .thumb-placeholder {
      width: 56px; height: 56px; border-radius: var(--radius-sm);
      background: var(--abit-gray-50); display: flex; align-items: center;
      justify-content: center; font-size: 0.7rem; color: var(--abit-gray-400); flex-shrink: 0;
    }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15,20,18,0.45);
      z-index: 200; display: none; align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: white; width: 100%; max-width: 520px; max-height: 92dvh;
      overflow-y: auto; border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      padding: var(--space-5);
    }
    @media (min-width: 600px) {
      .modal-overlay { align-items: center; }
      .modal { border-radius: var(--radius-xl); max-height: 90vh; }
    }
    .preview-img {
      width: 100%; max-height: 180px; object-fit: cover;
      border-radius: var(--radius-md); margin-bottom: var(--space-3);
      display: none; background: var(--abit-gray-50);
    }
    .row-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .btn-sm {
      min-height: 32px; padding: 0 10px; font-size: 0.75rem;
      border-radius: var(--radius-sm); font-weight: 600;
    }
    .btn-sm.outline { border: 1px solid var(--abit-gray-200); color: var(--abit-gray-600); }
    .btn-sm.danger { border: 1px solid #FECACA; color: #B91C1C; }
    .btn-sm.success { background: var(--abit-green); color: white; }
    .btn-sm.warn { background: #FEF3C7; color: #92400E; }
  </style>
</head>
<body>
  <div id="auth-gate" style="display:none;min-height:100dvh;align-items:center;justify-content:center;padding:var(--space-6)">
    <div class="card" style="max-width:360px;width:100%;text-align:center">
      <p style="margin-bottom:var(--space-4)">Connexion admin requise.</p>
      <a href="index.html" class="btn btn-primary">Se connecter</a>
    </div>
  </div>

  <div id="admin-app" style="display:none">
    <div class="admin-layout">
      <aside class="sidebar">
        <div class="logo">ABIT <span style="color:var(--abit-gold)">Admin</span></div>
        <nav>
          <a href="index.html">Tableau de bord</a>
          <a href="exchanges.html">Échanges</a>
          <a href="orders.html">Commandes</a>
          <a href="products.html" class="active">Produits</a>
          <a href="tracking.html">Tracking</a>
          <a href="customers.html">Clients</a>
          <a href="settings.html">Paramètres</a>
          <a href="#" id="btn-logout" style="margin-top:var(--space-6);color:#f87171">Déconnexion</a>
        </nav>
      </aside>

      <main class="main-admin">
        <div class="toolbar">
          <div>
            <h1 style="font-size:1.35rem;font-weight:700">Produits</h1>
            <p style="font-size:0.8rem;color:var(--abit-gray-400)" id="count-label">Chargement…</p>
          </div>
          <button class="btn btn-primary" id="btn-new" style="min-height:42px;font-size:0.9rem">+ Nouveau produit</button>
        </div>

        <div class="card" style="padding:0;overflow:hidden">
          <div id="list"></div>
          <div id="empty" class="empty-state" style="display:none;padding:var(--space-10)">
            <p>Aucun produit.</p>
            <p style="font-size:0.85rem;margin-top:8px">Ajoute ton premier article pour la boutique client.</p>
          </div>
        </div>
      </main>
    </div>

    <nav class="mobile-nav">
      <a href="index.html">Dashboard</a>
      <a href="exchanges.html">Échanges</a>
      <a href="orders.html">Commandes</a>
      <a href="products.html" class="active">Produits</a>
      <a href="settings.html">Réglages</a>
    </nav>
  </div>

  <!-- Modal formulaire -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-4)">
        <h2 style="font-size:1.15rem;font-weight:700" id="modal-title">Nouveau produit</h2>
        <button type="button" id="modal-close" style="font-size:1.5rem;line-height:1;color:var(--abit-gray-400)">×</button>
      </div>

      <input type="hidden" id="f-id" />

      <img id="f-preview" class="preview-img" alt="Aperçu" />

      <div class="form-group">
        <label class="form-label">Photo</label>
        <input type="file" id="f-image" accept="image/*" class="form-input" style="padding-top:10px" />
      </div>

      <div class="form-group">
        <label class="form-label">Nom du produit *</label>
        <input type="text" id="f-name" class="form-input" placeholder="Ex. Écouteurs Bluetooth" />
      </div>

      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea id="f-desc" class="form-textarea" placeholder="Caractéristiques, contenu du colis…"></textarea>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)">
        <div class="form-group">
          <label class="form-label">Prix client (XOF) *</label>
          <input type="number" id="f-price-xof" class="form-input" min="0" placeholder="25000" />
        </div>
        <div class="form-group">
          <label class="form-label">Prix fournisseur (RMB)</label>
          <input type="number" id="f-price-rmb" class="form-input" min="0" step="0.01" placeholder="45" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Catégorie</label>
        <input type="text" id="f-category" class="form-input" placeholder="Électronique, Mode…" />
      </div>

      <div class="form-group">
        <label class="form-label">Stock (optionnel)</label>
        <input type="number" id="f-stock" class="form-input" min="0" placeholder="Illimité si vide" />
      </div>

      <div class="form-group">
        <label class="form-label">Délai estimé</label>
        <input type="text" id="f-delay" class="form-input" placeholder="12–20 jours" />
      </div>

      <label style="display:flex;align-items:center;gap:10px;margin-bottom:var(--space-5);font-size:0.9rem">
        <input type="checkbox" id="f-published" checked style="width:18px;height:18px" />
        Publier tout de suite (visible dans la boutique client)
      </label>

      <p id="form-error" style="color:var(--status-error);font-size:0.85rem;margin-bottom:var(--space-3);display:none"></p>

      <div style="display:flex;gap:var(--space-3)">
        <button type="button" class="btn btn-outline" id="btn-cancel" style="flex:1">Annuler</button>
        <button type="button" class="btn btn-primary" id="btn-save" style="flex:2">Enregistrer</button>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      auth, db, storage, requireAdmin, signOut, uploadProductImage,
      collection, getDocs, addDoc, updateDoc, deleteDoc, doc, serverTimestamp
    } from "./js/firebase-init.js";

    const listEl = document.getElementById("list");
    const emptyEl = document.getElementById("empty");
    const modal = document.getElementById("modal");
    let products = [];
    let editingId = null;
    let existingImageUrl = "";

    const session = await requireAdmin();
    if (!session) {
      document.getElementById("auth-gate").style.display = "flex";
    } else {
      document.getElementById("admin-app").style.display = "block";
      await loadProducts();
    }

    document.getElementById("btn-logout")?.addEventListener("click", (e) => {
      e.preventDefault();
      signOut(auth).then(() => location.href = "index.html");
    });

    async function loadProducts() {
      listEl.innerHTML = "";
      const snap = await getDocs(collection(db, "products"));
      products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      // tri local par date desc
      products.sort((a, b) => {
        const ta = a.updatedAt?.toMillis?.() || a.createdAt?.toMillis?.() || 0;
        const tb = b.updatedAt?.toMillis?.() || b.createdAt?.toMillis?.() || 0;
        return tb - ta;
      });
      document.getElementById("count-label").textContent =
        `${products.length} produit${products.length !== 1 ? "s" : ""} · ${products.filter(p => p.published).length} publié(s)`;

      if (!products.length) {
        emptyEl.style.display = "block";
        return;
      }
      emptyEl.style.display = "none";

      products.forEach(p => {
        const row = document.createElement("div");
        row.className = "product-row";
        const img = p.imageUrl
          ? `<img class="thumb" src="${p.imageUrl}" alt="" />`
          : `<div class="thumb-placeholder">—</div>`;
        row.innerHTML = `
          ${img}
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:0.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(p.name || "Sans nom")}</div>
            <div style="font-size:0.8rem;color:var(--abit-gray-400);margin-top:2px">
              ${p.priceXof != null ? Number(p.priceXof).toLocaleString("fr-FR") + " XOF" : "—"}
              ${p.category ? " · " + escapeHtml(p.category) : ""}
            </div>
            <div class="row-actions">
              <span class="badge ${p.published ? "badge-success" : "badge-pending"}">${p.published ? "Publié" : "Brouillon"}</span>
              <button type="button" class="btn-sm outline" data-edit="${p.id}">Modifier</button>
              <button type="button" class="btn-sm ${p.published ? "warn" : "success"}" data-toggle="${p.id}">${p.published ? "Dépublier" : "Publier"}</button>
              <button type="button" class="btn-sm danger" data-del="${p.id}">Supprimer</button>
            </div>
          </div>`;
        listEl.appendChild(row);
      });

      listEl.querySelectorAll("[data-edit]").forEach(btn => {
        btn.addEventListener("click", () => openEdit(btn.dataset.edit));
      });
      listEl.querySelectorAll("[data-toggle]").forEach(btn => {
        btn.addEventListener("click", () => togglePublish(btn.dataset.toggle));
      });
      listEl.querySelectorAll("[data-del]").forEach(btn => {
        btn.addEventListener("click", () => removeProduct(btn.dataset.del));
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function openModal() {
      modal.classList.add("open");
      document.body.style.overflow = "hidden";
    }
    function closeModal() {
      modal.classList.remove("open");
      document.body.style.overflow = "";
      editingId = null;
      existingImageUrl = "";
      document.getElementById("f-id").value = "";
      document.getElementById("f-name").value = "";
      document.getElementById("f-desc").value = "";
      document.getElementById("f-price-xof").value = "";
      document.getElementById("f-price-rmb").value = "";
      document.getElementById("f-category").value = "";
      document.getElementById("f-stock").value = "";
      document.getElementById("f-delay").value = "";
      document.getElementById("f-published").checked = true;
      document.getElementById("f-image").value = "";
      document.getElementById("f-preview").style.display = "none";
      document.getElementById("f-preview").src = "";
      document.getElementById("form-error").style.display = "none";
      document.getElementById("modal-title").textContent = "Nouveau produit";
    }

    document.getElementById("btn-new").addEventListener("click", () => {
      closeModal();
      document.getElementById("modal-title").textContent = "Nouveau produit";
      openModal();
    });
    document.getElementById("modal-close").addEventListener("click", closeModal);
    document.getElementById("btn-cancel").addEventListener("click", closeModal);

    document.getElementById("f-image").addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      const preview = document.getElementById("f-preview");
      if (!file) { preview.style.display = "none"; return; }
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
    });

    function openEdit(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;
      editingId = id;
      existingImageUrl = p.imageUrl || "";
      document.getElementById("modal-title").textContent = "Modifier le produit";
      document.getElementById("f-id").value = id;
      document.getElementById("f-name").value = p.name || "";
      document.getElementById("f-desc").value = p.description || "";
      document.getElementById("f-price-xof").value = p.priceXof ?? "";
      document.getElementById("f-price-rmb").value = p.priceRmb ?? "";
      document.getElementById("f-category").value = p.category || "";
      document.getElementById("f-stock").value = p.stock ?? "";
      document.getElementById("f-delay").value = p.deliveryDelay || "";
      document.getElementById("f-published").checked = !!p.published;
      const preview = document.getElementById("f-preview");
      if (p.imageUrl) {
        preview.src = p.imageUrl;
        preview.style.display = "block";
      }
      openModal();
    }

    document.getElementById("btn-save").addEventListener("click", async () => {
      const name = document.getElementById("f-name").value.trim();
      const priceXof = Number(document.getElementById("f-price-xof").value);
      const err = document.getElementById("form-error");
      err.style.display = "none";

      if (!name || !priceXof || priceXof < 0) {
        err.textContent = "Nom et prix XOF obligatoires.";
        err.style.display = "block";
        return;
      }

      const btn = document.getElementById("btn-save");
      btn.disabled = true;
      btn.textContent = "Enregistrement…";

      try {
        const payload = {
          name,
          description: document.getElementById("f-desc").value.trim(),
          priceXof,
          priceRmb: document.getElementById("f-price-rmb").value
            ? Number(document.getElementById("f-price-rmb").value) : null,
          category: document.getElementById("f-category").value.trim() || null,
          stock: document.getElementById("f-stock").value !== ""
            ? Number(document.getElementById("f-stock").value) : null,
          deliveryDelay: document.getElementById("f-delay").value.trim() || null,
          published: document.getElementById("f-published").checked,
          updatedAt: serverTimestamp()
        };

        const file = document.getElementById("f-image").files?.[0];
        let imageUrl = existingImageUrl;

        if (editingId) {
          if (file) {
            imageUrl = await uploadProductImage(file, editingId);
          }
          payload.imageUrl = imageUrl || null;
          await updateDoc(doc(db, "products", editingId), payload);
        } else {
          payload.createdAt = serverTimestamp();
          payload.imageUrl = null;
          const refDoc = await addDoc(collection(db, "products"), payload);
          if (file) {
            imageUrl = await uploadProductImage(file, refDoc.id);
            await updateDoc(doc(db, "products", refDoc.id), { imageUrl });
          }
        }

        closeModal();
        await loadProducts();
      } catch (e) {
        console.error(e);
        err.textContent = "Erreur : " + (e.message || "vérifie les règles Firebase / Storage.");
        err.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Enregistrer";
      }
    });

    async function togglePublish(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;
      await updateDoc(doc(db, "products", id), {
        published: !p.published,
        updatedAt: serverTimestamp()
      });
      await loadProducts();
    }

    async function removeProduct(id) {
      if (!confirm("Supprimer ce produit définitivement ?")) return;
      await deleteDoc(doc(db, "products", id));
      await loadProducts();
    }
  </script>
</body>
</html>
