<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B3D2E" />
  <title>ABIT Admin — Produits</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/design-system.css" />
  <style>
    .admin-layout { display: flex; min-height: 100dvh; }
    .sidebar {
      width: 240px; background: var(--abit-green-dark); color: white;
      padding: var(--space-6) var(--space-4); flex-shrink: 0; display: none;
    }
    @media (min-width: 900px) {
      .sidebar { display: block; }
      .mobile-nav { display: none !important; }
    }
    .sidebar .logo { font-size: 1.25rem; font-weight: 700; margin-bottom: var(--space-8); }
    .sidebar a {
      display: block; padding: var(--space-3); border-radius: var(--radius-sm);
      margin-bottom: 2px; font-size: 0.9rem; color: rgba(255,255,255,0.75);
    }
    .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.1); color: white; }
    .main-admin { flex: 1; padding: var(--space-4); padding-bottom: 80px; max-width: 100%; overflow-x: hidden; }
    .mobile-nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: white;
      border-top: 1px solid var(--abit-gray-100); display: flex; z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .mobile-nav a {
      flex: 1; min-width: 70px; text-align: center; padding: 10px 4px;
      font-size: 0.65rem; color: var(--abit-gray-400);
    }
    .mobile-nav a.active { color: var(--abit-green); }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: var(--space-3);
      justify-content: space-between; align-items: center; margin-bottom: var(--space-5);
    }
    .product-row {
      display: flex; gap: var(--space-3); align-items: center;
      padding: var(--space-3); border-bottom: 1px solid var(--abit-gray-100);
    }
    .thumb {
      width: 56px; height: 56px; border-radius: var(--radius-sm);
      object-fit: cover; background: var(--abit-gray-50); flex-shrink: 0;
    }
    .thumb-placeholder {
      width: 56px; height: 56px; border-radius: var(--radius-sm);
      background: var(--abit-gray-50); display: flex; align-items: center;
      justify-content: center; font-size: 0.7rem; color: var(--abit-gray-400); flex-shrink: 0;
    }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15,20,18,0.45);
      z-index: 200; display: none; align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: white; width: 100%; max-width: 520px; max-height: 92dvh;
      overflow-y: auto; border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      padding: var(--space-5);
    }
    @media (min-width: 600px) {
      .modal-overlay { align-items: center; }
      .modal { border-radius: var(--radius-xl); max-height: 90vh; }
    }
    .preview-grid {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: var(--space-3);
    }
    .preview-item {
      position: relative; width: 72px; height: 72px;
    }
    .preview-item img {
      width: 72px; height: 72px; object-fit: cover; border-radius: 8px;
      border: 1px solid var(--abit-gray-100);
    }
    .preview-item button {
      position: absolute; top: -6px; right: -6px; width: 22px; height: 22px;
      border-radius: 50%; background: #DC2626; color: #fff; font-size: 12px;
      border: none; line-height: 1;
    }
    .row-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .btn-sm {
      min-height: 32px; padding: 0 10px; font-size: 0.75rem;
      border-radius: var(--radius-sm); font-weight: 600;
    }
    .btn-sm.outline { border: 1px solid var(--abit-gray-200); color: var(--abit-gray-600); }
    .btn-sm.danger { border: 1px solid #FECACA; color: #B91C1C; }
    .btn-sm.success { background: var(--abit-green); color: white; }
    .btn-sm.warn { background: #FEF3C7; color: #92400E; }
  </style>
</head>
<body>
  <div id="admin-app">
    <div class="admin-layout">
      <aside class="sidebar">
        <div class="logo">ABIT <span style="color:var(--abit-gold)">Admin</span></div>
        <nav>
          <a href="index.html">Tableau de bord</a>
          <a href="exchanges.html">Echanges</a>
          <a href="orders.html">Commandes</a>
          <a href="products.html" class="active">Produits</a>
          <a href="settings.html">Parametres</a>
        </nav>
      </aside>

      <main class="main-admin">
        <div class="toolbar">
          <div>
            <h1 style="font-size:1.35rem;font-weight:700">Produits</h1>
            <p style="font-size:0.8rem;color:var(--abit-gray-400)" id="count-label">Chargement…</p>
          </div>
          <button class="btn btn-primary" id="btn-new" style="min-height:42px;font-size:0.9rem">+ Nouveau produit</button>
        </div>

        <div class="card" style="padding:0;overflow:hidden">
          <div id="list"></div>
          <div id="empty" class="empty-state" style="display:none;padding:var(--space-10)">
            <p>Aucun produit.</p>
          </div>
        </div>
      </main>
    </div>

    <nav class="mobile-nav">
      <a href="index.html">Dashboard</a>
      <a href="exchanges.html">Echanges</a>
      <a href="orders.html">Commandes</a>
      <a href="products.html" class="active">Produits</a>
      <a href="settings.html">Reglages</a>
    </nav>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-4)">
        <h2 style="font-size:1.15rem;font-weight:700" id="modal-title">Nouveau produit</h2>
        <button type="button" id="modal-close" style="font-size:1.5rem;line-height:1;color:var(--abit-gray-400)">×</button>
      </div>

      <div class="form-group">
        <label class="form-label">Photos (plusieurs possibles)</label>
        <input type="file" id="f-images" accept="image/*" multiple class="form-input" style="padding-top:10px" />
        <div class="preview-grid" id="preview-grid"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Nom du produit *</label>
        <input type="text" id="f-name" class="form-input" placeholder="Ex. Detergent" />
      </div>

      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea id="f-desc" class="form-textarea" placeholder="Caracteristiques, contenu du pack…"></textarea>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)">
        <div class="form-group">
          <label class="form-label">Prix client (XOF) *</label>
          <input type="number" id="f-price-xof" class="form-input" min="0" placeholder="25000" />
        </div>
        <div class="form-group">
          <label class="form-label">Prix fournisseur (RMB)</label>
          <input type="number" id="f-price-rmb" class="form-input" min="0" step="0.01" placeholder="45" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Categorie</label>
        <input type="text" id="f-category" class="form-input" placeholder="Maison, Mode…" />
      </div>

      <div class="form-group">
        <label class="form-label">Delai estime</label>
        <input type="text" id="f-delay" class="form-input" placeholder="12-20 jours" />
      </div>

      <label style="display:flex;align-items:center;gap:10px;margin-bottom:var(--space-5);font-size:0.9rem">
        <input type="checkbox" id="f-published" checked style="width:18px;height:18px" />
        Publier tout de suite
      </label>

      <p id="form-error" style="color:var(--status-error);font-size:0.85rem;margin-bottom:var(--space-3);display:none"></p>

      <div style="display:flex;gap:var(--space-3)">
        <button type="button" class="btn btn-outline" id="btn-cancel" style="flex:1">Annuler</button>
        <button type="button" class="btn btn-primary" id="btn-save" style="flex:2">Enregistrer</button>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      db, uploadProductImage,
      collection, getDocs, addDoc, updateDoc, deleteDoc, doc, serverTimestamp
    } from "./js/firebase-init.js";

    const listEl = document.getElementById("list");
    const emptyEl = document.getElementById("empty");
    const modal = document.getElementById("modal");
    const previewGrid = document.getElementById("preview-grid");

    let products = [];
    let editingId = null;
    let existingUrls = [];
    let newFiles = [];

    await loadProducts();

    function coverOf(p) {
      if (p.imageUrls && p.imageUrls.length) return p.imageUrls[0];
      return p.imageUrl || "";
    }

    async function loadProducts() {
      listEl.innerHTML = "";
      try {
        const snap = await getDocs(collection(db, "products"));
        products = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        products.sort(function (a, b) {
          var ta = (a.updatedAt && a.updatedAt.toMillis) ? a.updatedAt.toMillis() : 0;
          var tb = (b.updatedAt && b.updatedAt.toMillis) ? b.updatedAt.toMillis() : 0;
          return tb - ta;
        });
      } catch (e) {
        console.warn(e);
        products = [];
      }

      document.getElementById("count-label").textContent =
        products.length + " produit(s) · " +
        products.filter(function (p) { return p.published; }).length + " publie(s)";

      if (!products.length) {
        emptyEl.style.display = "block";
        return;
      }
      emptyEl.style.display = "none";

      products.forEach(function (p) {
        var row = document.createElement("div");
        row.className = "product-row";

        var url = coverOf(p);
        if (url) {
          var img = document.createElement("img");
          img.className = "thumb";
          img.src = url;
          img.alt = "";
          row.appendChild(img);
        } else {
          var ph = document.createElement("div");
          ph.className = "thumb-placeholder";
          ph.textContent = "-";
          row.appendChild(ph);
        }

        var info = document.createElement("div");
        info.style.flex = "1";
        info.style.minWidth = "0";

        var title = document.createElement("div");
        title.style.fontWeight = "600";
        title.style.fontSize = "0.95rem";
        title.style.whiteSpace = "nowrap";
        title.style.overflow = "hidden";
        title.style.textOverflow = "ellipsis";
        title.textContent = p.name || "Sans nom";

        var sub = document.createElement("div");
        sub.style.fontSize = "0.8rem";
        sub.style.color = "var(--abit-gray-400)";
        sub.style.marginTop = "2px";
        var priceTxt = p.priceXof != null ? Number(p.priceXof).toLocaleString("fr-FR") + " XOF" : "-";
        var nImg = (p.imageUrls && p.imageUrls.length) ? p.imageUrls.length : (p.imageUrl ? 1 : 0);
        sub.textContent = priceTxt + (p.category ? " · " + p.category : "") + (nImg ? " · " + nImg + " photo(s)" : "");

        var actions = document.createElement("div");
        actions.className = "row-actions";

        var badge = document.createElement("span");
        badge.className = "badge " + (p.published ? "badge-success" : "badge-pending");
        badge.textContent = p.published ? "Publie" : "Brouillon";

        var btnEdit = document.createElement("button");
        btnEdit.type = "button";
        btnEdit.className = "btn-sm outline";
        btnEdit.textContent = "Modifier";
        btnEdit.addEventListener("click", function () { openEdit(p.id); });

        var btnToggle = document.createElement("button");
        btnToggle.type = "button";
        btnToggle.className = "btn-sm " + (p.published ? "warn" : "success");
        btnToggle.textContent = p.published ? "Depublier" : "Publier";
        btnToggle.addEventListener("click", function () { togglePublish(p.id); });

        var btnDel = document.createElement("button");
        btnDel.type = "button";
        btnDel.className = "btn-sm danger";
        btnDel.textContent = "Supprimer";
        btnDel.addEventListener("click", function () { removeProduct(p.id); });

        actions.appendChild(badge);
        actions.appendChild(btnEdit);
        actions.appendChild(btnToggle);
        actions.appendChild(btnDel);

        info.appendChild(title);
        info.appendChild(sub);
        info.appendChild(actions);
        row.appendChild(info);
        listEl.appendChild(row);
      });
    }

    function renderPreviews() {
      previewGrid.innerHTML = "";
      existingUrls.forEach(function (url, i) {
        var item = document.createElement("div");
        item.className = "preview-item";
        var img = document.createElement("img");
        img.src = url;
        var rm = document.createElement("button");
        rm.type = "button";
        rm.textContent = "x";
        rm.addEventListener("click", function () {
          existingUrls.splice(i, 1);
          renderPreviews();
        });
        item.appendChild(img);
        item.appendChild(rm);
        previewGrid.appendChild(item);
      });
      newFiles.forEach(function (file, i) {
        var item = document.createElement("div");
        item.className = "preview-item";
        var img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        var rm = document.createElement("button");
        rm.type = "button";
        rm.textContent = "x";
        rm.addEventListener("click", function () {
          newFiles.splice(i, 1);
          renderPreviews();
        });
        item.appendChild(img);
        item.appendChild(rm);
        previewGrid.appendChild(item);
      });
    }

    function openModal() {
      modal.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      modal.classList.remove("open");
      document.body.style.overflow = "";
      editingId = null;
      existingUrls = [];
      newFiles = [];
      document.getElementById("f-name").value = "";
      document.getElementById("f-desc").value = "";
      document.getElementById("f-price-xof").value = "";
      document.getElementById("f-price-rmb").value = "";
      document.getElementById("f-category").value = "";
      document.getElementById("f-delay").value = "";
      document.getElementById("f-published").checked = true;
      document.getElementById("f-images").value = "";
      document.getElementById("form-error").style.display = "none";
      document.getElementById("modal-title").textContent = "Nouveau produit";
      previewGrid.innerHTML = "";
    }

    document.getElementById("btn-new").addEventListener("click", function () {
      closeModal();
      openModal();
    });
    document.getElementById("modal-close").addEventListener("click", closeModal);
    document.getElementById("btn-cancel").addEventListener("click", closeModal);

    document.getElementById("f-images").addEventListener("change", function (e) {
      var files = e.target.files;
      if (!files || !files.length) return;
      for (var i = 0; i < files.length; i++) newFiles.push(files[i]);
      e.target.value = "";
      renderPreviews();
    });

    function openEdit(id) {
      var p = products.find(function (x) { return x.id === id; });
      if (!p) return;
      editingId = id;
      if (p.imageUrls && p.imageUrls.length) existingUrls = p.imageUrls.slice();
      else if (p.imageUrl) existingUrls = [p.imageUrl];
      else existingUrls = [];
      newFiles = [];
      document.getElementById("modal-title").textContent = "Modifier le produit";
      document.getElementById("f-name").value = p.name || "";
      document.getElementById("f-desc").value = p.description || "";
      document.getElementById("f-price-xof").value = p.priceXof != null ? p.priceXof : "";
      document.getElementById("f-price-rmb").value = p.priceRmb != null ? p.priceRmb : "";
      document.getElementById("f-category").value = p.category || "";
      document.getElementById("f-delay").value = p.deliveryDelay || "";
      document.getElementById("f-published").checked = !!p.published;
      renderPreviews();
      openModal();
    }

    document.getElementById("btn-save").addEventListener("click", async function () {
      var name = document.getElementById("f-name").value.trim();
      var priceXof = Number(document.getElementById("f-price-xof").value);
      var err = document.getElementById("form-error");
      err.style.display = "none";

      if (!name || !priceXof || priceXof < 0) {
        err.textContent = "Nom et prix XOF obligatoires.";
        err.style.display = "block";
        return;
      }

      var btn = document.getElementById("btn-save");
      btn.disabled = true;
      btn.textContent = "Enregistrement…";

      try {
        var payload = {
          name: name,
          description: document.getElementById("f-desc").value.trim(),
          priceXof: priceXof,
          priceRmb: document.getElementById("f-price-rmb").value
            ? Number(document.getElementById("f-price-rmb").value) : null,
          category: document.getElementById("f-category").value.trim() || null,
          deliveryDelay: document.getElementById("f-delay").value.trim() || null,
          published: document.getElementById("f-published").checked,
          updatedAt: serverTimestamp()
        };

        var productId = editingId;
        if (!productId) {
          payload.createdAt = serverTimestamp();
          payload.imageUrl = null;
          payload.imageUrls = [];
          var refDoc = await addDoc(collection(db, "products"), payload);
          productId = refDoc.id;
        }

        var uploaded = [];
        for (var i = 0; i < newFiles.length; i++) {
          var url = await uploadProductImage(newFiles[i], productId);
          uploaded.push(url);
        }

        var allUrls = existingUrls.concat(uploaded);
        await updateDoc(doc(db, "products", productId), {
          name: payload.name,
          description: payload.description,
          priceXof: payload.priceXof,
          priceRmb: payload.priceRmb,
          category: payload.category,
          deliveryDelay: payload.deliveryDelay,
          published: payload.published,
          imageUrls: allUrls,
          imageUrl: allUrls[0] || null,
          updatedAt: serverTimestamp()
        });

        closeModal();
        await loadProducts();
      } catch (e) {
        console.error(e);
        err.textContent = "Erreur : " + (e.message || "Firebase");
        err.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Enregistrer";
      }
    });

    async function togglePublish(id) {
      var p = products.find(function (x) { return x.id === id; });
      if (!p) return;
      await updateDoc(doc(db, "products", id), {
        published: !p.published,
        updatedAt: serverTimestamp()
      });
      await loadProducts();
    }

    async function removeProduct(id) {
      if (!confirm("Supprimer ce produit definitivement ?")) return;
      await deleteDoc(doc(db, "products", id));
      await loadProducts();
    }
  </script>
</body>
</html>
